<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>

<table>
    <h1>안녕하세요<span th:text="${name}"></span></h1>

    <tr th:each="item : ${articles}">
        <td th:text="${item.title}"></td>
        <td th:text="${item.content}"></td>
    </tr>
</table>

<!--<div>-->
<!--    <p th:text="${person.name}"></p>-->
<!--    <p th:text="${person.age}"></p>-->
<!--    <p th:text="${person.id}"></p>-->
<!--</div>-->
<!-- ★ 시험출제 , 타임리프 문법 ${}로 하나하나 가져와야하는걸 오브젝트로 먼저 선언을 하고 *{}로 가져옴 -->
<div th:object="${person}">
    <p th:text="|이름: *{name}|"></p>
    <p th:text="|나이: *{age}|"></p>
    <p th:text="|아이디: *{id}|"></p>
    <!-- 원래는 ${} 표시로 가져와야함
    <div>
        <h4 th:text="${person.name}"/>
        <h4 th:text="${person.age}"/>
    </div>
    -->

    <!-- 취미를 ul 태그로 동적으로 생성되도록 하시오.-->
    <ul>
        <li th:each="hobby : ${person.hobbies}"
            th:text="${hobby}">
            취미
        </li>
    </ul>
</div>

<div th:if="${error != null}">
    에러발생
</div>

<div th:unless="${error != null}">
    정상 작동 중
</div>

<div th:if="${error == null}">
    정상 작동 중
</div>
<!-- temporals가 모델 객체에서 가져온게 아님을 구분하기 위해 앞에 #을 붙임 -->
<p th:text="${#temporals.format(today, 'MM-dd-yyyy')}"></p>
</body>
</html>
